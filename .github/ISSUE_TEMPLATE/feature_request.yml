name: Idea or question
description: Something to add or change, or a question about Unlease.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you would like to do
      description: The need, in your words, before any solution. For a question, the question.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Unlease or elsewhere (Google's apps included), and what gets in the way.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Carnet
        - The server
        - A new app of the suite
        - The whole suite
