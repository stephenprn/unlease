# Every push and pull request: the shared packages, each program's checks, and the English dictionaries.
# A release runs it too, on its tag, before anything is published (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Shared packages (typecheck, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  web:
    name: The web apps (typecheck, lint, tests, both builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify -w web

  server:
    name: Server (typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify -w server

  mobile:
    name: ${{ matrix.name }} for Android (typecheck, lint, tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: notes, name: Carnet }
          - { app: pages, name: Pages }
          - { app: contacts, name: Contacts }
          - { app: calendar, name: Agenda }
    defaults:
      run:
        working-directory: mobile/${{ matrix.app }}
    env:
      # Its screen tests read French, the language the device reports.
      LANG: fr_FR.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run verify

  i18n:
    name: English dictionaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/i18n/check.mjs
