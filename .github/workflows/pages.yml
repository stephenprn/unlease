# The web demo on GitHub Pages: Carnet in the browser with made-up notes and pages, and a fake server inside the
# page (web/notes/src/dev). Nothing leaves the browser, and every load starts afresh.
#   a release (release.yml, once it is published) -> the demo of that release
#   by hand (Actions > Pages > Run workflow)      -> the demo of the chosen branch
# Once: Settings > Pages > Source: GitHub Actions, and the `github-pages` environment must allow the `v*` tags.
name: Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Under the site's sub-path (/unlease on <owner>.github.io); a host's unknown path gets 404.html, the app, which reads the path.
      - run: npm run build:demo -w web/notes -- --base "${{ steps.pages.outputs.base_path }}/"
      - run: cp web/notes/dist-demo/index.html web/notes/dist-demo/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/notes/dist-demo

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
