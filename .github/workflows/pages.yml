# The web demo on GitHub Pages, at https://demo.unlease.org (the repository's Pages domain): Carnet's, Pages', Contacts' and Agenda's web apps in the browser with made-up notes, pages, people and events, and a
# fake server inside each page (web/demo). Nothing leaves the browser, and every load starts afresh.
#   a release (release.yml, once it is published) -> the demo of that release
#   by hand (Actions > Pages > Run workflow)      -> the demo of the chosen branch
# Once: Settings > Pages > Source: GitHub Actions, and the `github-pages` environment must allow the `v*` tags.
name: Pages

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # At the site's root on a domain of its own (demo.unlease.org/notes/, /pages/, /contacts/, /agenda/); under the repository's
      # path on <owner>.github.io without one (/unlease/notes/…): GitHub says which (base_path).
      # a host's unknown path gets 404.html, which sends an app's address to its app's page (scripts/build.mjs).
      - run: npm run build:demo -w web -- --base "${{ steps.pages.outputs.base_path }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-demo

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
