# The Docker image (the server and the web apps it serves), for amd64 and arm64, on GitHub's container registry:
#   main         -> ghcr.io/<owner>/unlease:edge                  (what is being worked on: not for a server you rely on)
#   v1.2.3       -> ghcr.io/<owner>/unlease:1.2.3, :1.2, :latest  (run by release.yml, after the checks pass)
#   v1.2.3-rc.1  -> ghcr.io/<owner>/unlease:1.2.3-rc.1             (a release candidate: `latest` stays put)
# Each image carries its build provenance and an SBOM, and a signed attestation when the repository is public.
name: Image

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/unlease
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        # Attestations are free on public repositories only.
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/unlease
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
