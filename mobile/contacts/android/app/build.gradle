apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.stephenprn.contacts"
    // The suite's shared Kotlin and resources (mobile/shared/android: the organic view, haptics,
    // connectivity, media, the clipboard, SuiteLink), compiled into every app of the suite; and the
    // reminders kept on time (src/reminders), into the apps that ring; and the mirror account
    // (src/mirror), into the apps that copy their records into the phone's own (Contacts, Agenda).
    sourceSets {
        main {
            java.srcDirs += "${rootDir}/../../shared/android/src/main/java"
            java.srcDirs += "${rootDir}/../../shared/android/src/reminders/java"
            java.srcDirs += "${rootDir}/../../shared/android/src/mirror/java"
            res.srcDirs += "${rootDir}/../../shared/android/src/main/res"
        }
    }
    defaultConfig {
        applicationId "com.stephenprn.contacts"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10299
        versionName "0.1.2"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // The reminders' refresh with the app closed (src/reminders); Notifee's own version.
    implementation("androidx.work:work-runtime:2.8.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// ---------------------------------------------------------------------------
// Release signing (docs/RELEASING.md).
//
// The upload key never enters this repository. `android/keystore.properties` is
// gitignored and holds four values (storeFile, storePassword, keyAlias, keyPassword),
// and the keystore it points at lives outside the working tree, so no `git add -A` can
// sweep it in. GitHub releases write that file from repository secrets.
//
// Without that file the build still configures (Android Studio syncs, `assembleDebug`
// and `run-android` work), but a release build stops before any task runs: React
// Native's debug keystore ships in every project, so an APK signed with it is one anyone
// can sign an "update" for. `-PallowDebugSigning` lets a checkout with no key build a
// release APK signed with the debug key anyway, to try it on one's own phone, and says
// so; never hand such an APK to anyone. Bundles refuse even then: Play rejects an AAB
// signed with the debug key, and finding that out from the Console is worse than here.
// CI passes the flag only on a hand-run without secrets; a release fails without them
// and checks each APK's certificate (.github/workflows/android.yml).
// ---------------------------------------------------------------------------

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasUploadKey = keystorePropertiesFile.exists()
/** `-PallowDebugSigning` (or `=true`): a release APK signed with the debug key, to try it. */
def allowDebugSigning = findProperty("allowDebugSigning")?.toString()?.trim()?.toLowerCase() in ["", "true"]

if (hasUploadKey) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def missing = ["storeFile", "storePassword", "keyAlias", "keyPassword"].findAll {
        !keystoreProperties.getProperty(it)?.trim()
    }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "android/keystore.properties is missing ${missing.join(', ')}. " +
            "See android/keystore.properties.example."
        )
    }
}

/** Resolves `~/…` and relative paths, the latter against the `android/` directory. */
def resolveKeystoreFile = { String path ->
    path.startsWith("~/")
        ? new File(System.getProperty("user.home"), path.substring(2))
        : rootProject.file(path)
}

android {
    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile resolveKeystoreFile(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
                // v2/v3 are what Play and the platform verify. v1 (the JAR signature) is
                // still required to INSTALL below API 24, so it is derived rather than
                // hard-coded: `addapp` appends this same file verbatim to any adopted
                // repo with an android/ directory, and an older project on minSdk 21
                // would otherwise get a v2/v3-only APK that will not install on the
                // devices it targets. AGP's own default is exactly this expression.
                enableV1Signing defaultConfig.minSdkVersion.apiLevel < 24
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            // The upload key when there is one. Otherwise the debug key, which the guard
            // below lets through only with -PallowDebugSigning.
            signingConfig hasUploadKey ? signingConfigs.upload : signingConfigs.debug
        }
    }
}

// Refuse once the task graph is known, before any task runs, rather than from a task
// hook (failing in `packageRelease` or `bundleRelease` would already have built and
// debug-signed what it refuses). The graph, not the command line's task names, so that
// every road to a release package is covered: `assembleRelease`, `:app:installRelease`,
// `build`, an abbreviation such as `aR`.
gradle.taskGraph.whenReady { graph ->
    if (hasUploadKey) return
    def wanted = { String name -> graph.hasTask("${project.path}:${name}") }
    if (wanted("bundleRelease") || wanted("signReleaseBundle")) {
        throw new GradleException(
            "bundleRelease needs the upload key: android/keystore.properties is absent, so this " +
            "bundle would be signed with the debug key and Play would reject it outright " +
            "(-PallowDebugSigning does not apply to bundles). " +
            "Copy android/keystore.properties.example to android/keystore.properties and fill it in."
        )
    }
    if (!wanted("packageRelease")) return
    if (!allowDebugSigning) {
        throw new GradleException(
            "This release APK would be signed with React Native's public debug key: " +
            "android/keystore.properties is absent. Copy android/keystore.properties.example to " +
            "android/keystore.properties and fill it in (docs/RELEASING.md), or pass " +
            "-PallowDebugSigning to build one signed with the debug key, only to try it yourself."
        )
    }
    logger.warn(
        "-PallowDebugSigning: this release APK is signed with React Native's public debug key. " +
        "Try it on your own phone, never hand it to anyone: anyone can sign an update with that key."
    )
}

// The dev builds beside the released apps: `debug` and `devRelease` are `<applicationId>.dev`, signed
// with the debug key, named « … Dev », answering `unlease-contacts-dev://` (mobile/shared/android/dev-builds.gradle).
ext.suiteScheme = "unlease-contacts"
apply from: "${rootDir}/../../shared/android/dev-builds.gradle"
