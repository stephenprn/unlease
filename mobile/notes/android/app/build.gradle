apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.stephenprn.carnet"
    defaultConfig {
        applicationId "com.stephenprn.carnet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10099
        versionName "0.1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// ---------------------------------------------------------------------------
// Release signing (docs/RELEASING.md).
//
// The upload key never enters this repository. `android/keystore.properties` is
// gitignored and holds four values (storeFile, storePassword, keyAlias, keyPassword),
// and the keystore it points at lives outside the working tree, so no `git add -A` can
// sweep it in. GitHub releases write that file from repository secrets.
//
// Without that file the build still configures: release falls back to the debug
// keystore, so a fresh checkout can `assembleDebug` and `assembleRelease` for
// sideloading with no setup at all. Only `bundleRelease` insists, because an AAB signed
// with the universally-known debug key is not a thing Play will accept, and finding
// that out from the Console is worse than finding it out here.
// ---------------------------------------------------------------------------

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasUploadKey = keystorePropertiesFile.exists()

if (hasUploadKey) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    def missing = ["storeFile", "storePassword", "keyAlias", "keyPassword"].findAll {
        !keystoreProperties.getProperty(it)?.trim()
    }
    if (!missing.isEmpty()) {
        throw new GradleException(
            "android/keystore.properties is missing ${missing.join(', ')}. " +
            "See android/keystore.properties.example."
        )
    }
}

/** Resolves `~/…` and relative paths, the latter against the `android/` directory. */
def resolveKeystoreFile = { String path ->
    path.startsWith("~/")
        ? new File(System.getProperty("user.home"), path.substring(2))
        : rootProject.file(path)
}

android {
    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile resolveKeystoreFile(keystoreProperties.getProperty("storeFile"))
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
                // v2/v3 are what Play and the platform verify. v1 (the JAR signature) is
                // still required to INSTALL below API 24, so it is derived rather than
                // hard-coded: `addapp` appends this same file verbatim to any adopted
                // repo with an android/ directory, and an older project on minSdk 21
                // would otherwise get a v2/v3-only APK that will not install on the
                // devices it targets. AGP's own default is exactly this expression.
                enableV1Signing defaultConfig.minSdkVersion.apiLevel < 24
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            // The upload key when there is one, the debug key otherwise, so a checkout
            // with no keystore.properties still produces an installable APK.
            signingConfig hasUploadKey ? signingConfigs.upload : signingConfigs.debug
        }
    }
}

// Refuse at configuration time rather than from a task hook: `bundleRelease` is the
// last task in its own chain, so failing there would already have built and
// debug-signed the bundle before saying so.
if (!hasUploadKey &&
    gradle.startParameter.taskNames.any { it.toLowerCase().endsWith("bundlerelease") }) {
    throw new GradleException(
        "bundleRelease needs the upload key: android/keystore.properties is absent, so this " +
        "bundle would be signed with the debug key and Play would reject it outright. " +
        "Copy android/keystore.properties.example to android/keystore.properties and fill it in."
    )
}
